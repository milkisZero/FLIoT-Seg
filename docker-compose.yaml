version: '2.1'
networks:
  federated_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

services:
  db:
    image: mysql:8.3.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: "dksdlfduq2"
      MYSQL_DATABASE: "mobiusdb"
    container_name: db
    networks:
      federated_network:
        ipv4_address: 172.20.0.4
    ports:
      - "3306:3306"
    volumes:
      - ./Mobius/mobius/mobiusdb.sql:/docker-entrypoint-initdb.d/mobiusdb.sql
    healthcheck:
            test: ["CMD", "mysqladmin" ,"--password=dksdlfduq2","ping"]
            interval: 20s
            timeout: 20s
            retries: 5

  mobius:
    build:
      context: ./Mobius
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    container_name: mobius
    networks:
      federated_network:
        ipv4_address: 172.20.0.5
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "var http=require('http'); http.get({hostname:'localhost', port:7579, path:'/', headers:{'healthcheck':'true'}}, function(res){process.exit(0)}).on('error', function(){process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5

  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      federated_network:
        ipv4_address: 172.20.0.2
    volumes:
      - ./Server/fl_server.py:/app/fl_server.py
    depends_on:
      mobius:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://server:5011/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  gateway:
    build:
      context: ./nCube
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: gateway
    networks:
      federated_network:
        ipv4_address: 172.20.0.3
    depends_on:
      server:
        condition: service_healthy

  client1:
    build:
      context: ./Client
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    container_name: federated_client1
    networks:
      federated_network:
        ipv4_address: 172.20.0.101
    volumes:
      - ./Client/CICIDS_Splitted/client1_train.csv:/app/CICIDS_Splitted/client_train.csv
      - ./Client/CICIDS_Splitted/client1_test.csv:/app/CICIDS_Splitted/client_test.csv
      - ./Client/fl_client.py:/app/fl_client.py
    ports:
      - 4001:4000
    depends_on:
      server:
        condition: service_healthy
  client2:
    build:
      context: ./Client
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    container_name: federated_client2
    networks:
      federated_network:
        ipv4_address: 172.20.0.102
    volumes:
      - ./Client/CICIDS_Splitted/client2_train.csv:/app/CICIDS_Splitted/client_train.csv
      - ./Client/CICIDS_Splitted/client2_test.csv:/app/CICIDS_Splitted/client_test.csv
      - ./Client/fl_client.py:/app/fl_client.py
    ports:
      - 4002:4000
    depends_on:
      server:
        condition: service_healthy
