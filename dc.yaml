version: '2.1'

services:

 db:
    image: mysql:8.3.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: "dksdlfduq2"
      MYSQL_DATABASE: "mobiusdb"
    ports:
      - "3306:3306"
    volumes:
      - ./Mobius/mobius/mobiusdb.sql:/docker-entrypoint-initdb.d/mobiusdb.sql
    healthcheck:
            test: ["CMD", "mysqladmin" ,"--password=dksdlfduq2","ping"]
            interval: 20s
            timeout: 20s
            retries: 5
 node:
    image: "node:14.15.2"
    working_dir: /home/node/app
    environment:
      - NODE_ENV=production
    ports:
      - "7579:7579"
    volumes:
      - ./Mobius:/home/node/app
    command: "node mobius"
    depends_on:
      db: 
        condition: service_healthy  # db가 healthy 상태가 될 때까지 대기
 mqtt:
    image: eclipse-mosquitto:1.6
    ports:
      - "1883:1883"
    volumes:
      - ./etc/mosquitto:/etc/mosquitto:ro
      - ./var/log/mosquitto:/var/log/mosquitto:rw
    depends_on:
      - db

 python:
    build:
      context: .
      dockerfile: Dockerfile-python
    environment:
      - PYTHONUNBUFFERED=1
    tty: true
    stdin_open: true
    ports:
      - "5011:5011"
    volumes:
      - ./fl_server_revise_CICIDS.py:/app/fl_server.py
      - ./keras_compressor:/app/keras_compressor
    depends_on:
      - db
      - node
      - mqtt
